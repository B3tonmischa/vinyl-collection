<div class="space-y-3">
  @for (row of rows; track row.key) {
    <div class="rounded-lg border border-neutral-200 p-3">
      <div class="flex items-center gap-2">
        <input
          type="number"
          class="w-14 rounded border border-neutral-300 px-2 py-1 text-sm"
          [value]="row.position"
          (input)="updateRow(row.key, { position: +$any($event.target).value })"
          aria-label="Track position"
        />
        <input
          type="text"
          placeholder="Track title"
          class="min-w-0 flex-1 rounded border border-neutral-300 px-2 py-1 text-sm"
          [value]="row.title"
          (input)="updateRow(row.key, { title: $any($event.target).value })"
        />
        <input
          type="text"
          placeholder="Side"
          class="w-16 rounded border border-neutral-300 px-2 py-1 text-sm"
          [value]="row.side"
          (input)="updateRow(row.key, { side: $any($event.target).value })"
        />
        <button
          type="button"
          (click)="removeTrack(row.key)"
          class="text-sm text-red-500 hover:text-red-700"
          aria-label="Remove track"
        >
          ✕
        </button>
      </div>

      <div class="mt-2">
        <app-artist-override-picker
          [albumArtists]="albumArtists"
          [dirty]="row.dirty"
          [overrideArtists]="row.overrideArtists"
          (toggle)="onToggleArtist(row, $event)"
          (add)="onAddArtist(row, $event)"
          (resetToInherit)="onResetToInherit(row)"
        />
      </div>
    </div>
  } @empty {
    <p class="text-sm text-neutral-400">No tracks yet.</p>
  }

  <button type="button" (click)="addTrack()" class="text-sm text-neutral-600 underline hover:text-neutral-900">
    + Add track
  </button>
</div>
