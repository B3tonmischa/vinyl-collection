<div class="space-y-3">
  @for (row of rows(); track row.key) {
    <div class="rounded-lg border border-neutral-200 p-3">
      <div class="flex items-center gap-2">
        <input
          type="number"
          class="w-14 rounded border border-neutral-300 px-2 py-1 text-sm"
          [value]="row.position"
          (input)="updateRow(row.key, { position: +$any($event.target).value })"
          aria-label="Track position"
        />
        <input
          type="text"
          placeholder="Track title"
          class="min-w-0 flex-1 rounded border border-neutral-300 px-2 py-1 text-sm"
          [value]="row.title"
          (input)="updateRow(row.key, { title: $any($event.target).value })"
        />
        <select
          class="w-12 shrink-0 rounded border border-neutral-300 px-1 py-1 text-sm"
          (change)="selectSide(row, $any($event.target).value)"
          aria-label="Side"
        >
          <option value="" [selected]="!row.side.trim()">–</option>
          @for (side of sides(); track side) {
            <option [value]="side" [selected]="side === row.side.trim()">{{ side }}</option>
          }
        </select>
        @if (newSide(); as side) {
          <button
            type="button"
            (click)="addSide(row)"
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded border border-neutral-300 text-lg leading-none text-neutral-600 hover:border-neutral-500 hover:text-neutral-900"
            [attr.aria-label]="'Add side ' + side"
            [title]="'Add side ' + side"
          >
            +
          </button>
        }
      </div>

      <div class="mt-2">
        <app-artist-override-picker
          [albumArtists]="albumArtists()"
          [dirty]="row.dirty"
          [overrideArtists]="row.overrideArtists"
          (toggled)="onToggleArtist(row, $event)"
          (add)="onAddArtist(row, $event)"
          (resetToInherit)="onResetToInherit(row)"
        />
      </div>

      <div class="mt-2 flex justify-end">
        <button
          type="button"
          (click)="removeTrack(row.key)"
          class="text-xs text-red-500 hover:text-red-700"
          aria-label="Remove track"
        >
          ✕ Remove track
        </button>
      </div>
    </div>
  } @empty {
    <p class="text-sm text-neutral-400">No tracks yet.</p>
  }

  <button type="button" (click)="addTrack()" class="text-sm text-neutral-600 underline hover:text-neutral-900">
    + Add track
  </button>
</div>
