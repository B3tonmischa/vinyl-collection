<div class="space-y-2">
  <div class="flex flex-wrap gap-2">
    @for (artist of selected; track artist.id) {
      <span class="flex items-center gap-1 rounded-full bg-neutral-100 px-3 py-1 text-sm text-neutral-800">
        {{ artist.name }}
        <button
          type="button"
          (click)="remove(artist)"
          class="text-neutral-400 hover:text-neutral-700"
          [attr.aria-label]="'Remove ' + artist.name"
        >
          ✕
        </button>
      </span>
    }
  </div>
  <app-combobox
    placeholder="Add an artist…"
    [options]="options"
    [loading]="searchResource.isLoading()"
    (queryChange)="onQueryChange($event)"
    (optionSelected)="onOptionSelected($event)"
    (createRequested)="onCreateRequested($event)"
  />
</div>
