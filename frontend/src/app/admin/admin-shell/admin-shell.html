<div class="min-h-dvh bg-neutral-50">
  <header class="flex items-center justify-between border-b border-neutral-200 bg-white px-4 py-3">
    <nav class="flex items-center gap-4">
      <a routerLink="/admin" class="text-sm font-semibold text-neutral-900">Vinyl Archive Admin</a>
      <a routerLink="/admin/new" class="text-sm text-neutral-600 hover:text-neutral-900">+ New record</a>
      <button
        type="button"
        (click)="openImportDialog()"
        class="text-sm text-neutral-600 hover:text-neutral-900"
      >
        Import from Discogs
      </button>
    </nav>
    <div class="flex items-center gap-4">
      <a routerLink="/" class="text-sm text-neutral-500 hover:text-neutral-800">View public site</a>
      <button type="button" (click)="logout()" class="text-sm text-neutral-500 hover:text-neutral-800">
        Sign out
      </button>
    </div>
  </header>
  <main class="p-4">
    <router-outlet />
  </main>
  <app-scroll-to-top />
</div>
