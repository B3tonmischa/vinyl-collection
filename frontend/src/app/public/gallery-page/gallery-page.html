<div class="flex h-dvh flex-col bg-neutral-50">
  <header class="flex shrink-0 items-center justify-between gap-4 border-b border-neutral-200 bg-white px-4 py-3">
    <input
      type="search"
      placeholder="Search your collection…"
      class="w-full max-w-md rounded-full border border-neutral-300 px-4 py-2 text-sm focus:border-neutral-500 focus:outline-none"
      [value]="searchInput()"
      (input)="onSearchInput($any($event.target).value)"
    />
    <a routerLink="/admin" class="shrink-0 text-sm text-neutral-500 hover:text-neutral-800">Admin</a>
  </header>

  <main class="min-h-0 flex-1">
    @if (listResource.isLoading() && !listResource.hasValue()) {
      <div class="flex h-full items-center justify-center text-neutral-400">Loading your collection…</div>
    } @else if (listResource.error()) {
      <div class="flex h-full items-center justify-center text-red-500">Couldn't load your collection.</div>
    } @else if (hasActiveQuery()) {
      <div class="h-full overflow-y-auto p-4">
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
          @for (vinyl of listResource.value(); track vinyl.id) {
            <a [routerLink]="['/vinyl', vinyl.id]" class="block">
              <app-vinyl-card [vinyl]="vinyl" />
            </a>
          } @empty {
            <p class="col-span-full text-center text-sm text-neutral-400">No matches.</p>
          }
        </div>
      </div>
    } @else {
      <app-vinyl-carousel [vinyls]="listResource.value() ?? []" />
    }
  </main>
</div>
