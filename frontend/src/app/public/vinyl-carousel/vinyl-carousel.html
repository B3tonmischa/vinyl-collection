<div class="flex h-full flex-col">
  <div
    class="flex min-h-0 flex-1 select-none items-center justify-center gap-3 overflow-hidden px-4"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
  >
    @if (spinning()) {
      <div class="relative h-full w-full">
        @for (card of spinCards(); track card.virtualIndex) {
          <!--
            These cards exist only while the strip is gliding (a fraction of a
            second); a click retargets the glide. The keyboard has the same
            control through the arrow keys on the carousel itself.
          -->
          <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
          <div
            class="floating-card absolute top-1/2 -translate-x-1/2 -translate-y-1/2 text-center"
            [class.cursor-pointer]="!rollingIn()"
            [style.left]="'calc(50% + ' + card.offsetPx + 'px)'"
            [style.width.px]="card.style.widthPx"
            [style.opacity]="card.style.opacity"
            (click)="onSpinCardClick(card)"
          >
            <app-vinyl-card
              [vinyl]="card.vinyl"
              [showCaption]="!rollingIn()"
              [captionOverlay]="true"
              [captionDropIn]="false"
            />
          </div>
        }
      </div>
    } @else {
      @for (item of windowCards(); track item.index) {
        <button
          type="button"
          class="floating-card relative shrink-0 cursor-pointer transition-all duration-300 ease-out"
          data-carousel-card
          [class]="cardSizeClass(item.offset)"
          (click)="onCardClick(item)"
        >
          <app-vinyl-card [vinyl]="item.vinyl" [captionOverlay]="true" [captionDropIn]="!stepped()" />
        </button>
      } @empty {
        <p class="text-sm text-neutral-400">Your collection is empty — add your first record from the admin panel.</p>
      }
    }
  </div>

  <div class="flex shrink-0 items-center justify-center gap-4 py-3">
    <button
      type="button"
      (click)="prev()"
      aria-label="Previous record"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-neutral-600 shadow hover:bg-neutral-50"
    >
      ‹
    </button>
    <button
      type="button"
      (click)="spinAgain()"
      [attr.aria-disabled]="rollingIn() || windowCards().length === 0"
      aria-label="Spin to a random record"
      class="flex h-9 items-center gap-1.5 rounded-full bg-white px-4 text-sm text-neutral-600 shadow hover:bg-neutral-50 aria-disabled:cursor-default aria-disabled:opacity-50 aria-disabled:hover:bg-white"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-4 w-4 shrink-0"
        [class.animate-spin]="rollingIn()"
      >
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
      </svg>
      Spin
    </button>
    <button
      type="button"
      (click)="next()"
      aria-label="Next record"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-neutral-600 shadow hover:bg-neutral-50"
    >
      ›
    </button>
  </div>
</div>
