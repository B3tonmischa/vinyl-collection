<!-- The dark area around the photo, header and footer included, acts as the backdrop (see onBackdropClick). -->
<div class="flex h-full flex-col bg-neutral-950 text-white select-none">
  <div class="flex items-center justify-between gap-4 px-4 py-3">
    <!-- Screen readers hear the position with the caption, in the live region below. -->
    <p class="text-sm text-neutral-300 tabular-nums" aria-hidden="true">{{ position() }}</p>
    <button
      type="button"
      class="lightbox-close flex h-11 w-11 cursor-pointer items-center justify-center rounded-full text-neutral-200 hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-white"
      aria-label="Close"
      (click)="close()"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <div
    class="relative flex min-h-0 flex-1 touch-pan-y touch-pinch-zoom items-center justify-center px-2 sm:px-20"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event, true)"
  >
    @if (slide(); as slide) {
      @if (loadedId() !== slide.image.id) {
        <span
          class="pointer-events-none absolute h-8 w-8 animate-spin rounded-full border-2 border-white/20 border-t-white"
          aria-hidden="true"
        ></span>
      }
      <img
        [src]="url()"
        [alt]="slide.caption"
        class="max-h-full max-w-full object-contain"
        draggable="false"
        (load)="loadedId.set(slide.image.id)"
      />

      @if (slides.length > 1) {
        <button
          type="button"
          class="absolute left-2 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-black/40 text-neutral-100 hover:bg-black/70 focus-visible:outline-2 focus-visible:outline-white sm:left-4"
          aria-label="Previous photo"
          (click)="step(-1)"
        >
          <svg
            viewBox="0 0 24 24"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button
          type="button"
          class="absolute right-2 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full bg-black/40 text-neutral-100 hover:bg-black/70 focus-visible:outline-2 focus-visible:outline-white sm:right-4"
          aria-label="Next photo"
          (click)="step(1)"
        >
          <svg
            viewBox="0 0 24 24"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      }
    }
  </div>

  <div class="px-4 pt-3 pb-[max(1rem,env(safe-area-inset-bottom))]">
    <p class="text-center text-sm text-neutral-200" aria-hidden="true">{{ slide()?.caption }}</p>
    <p class="sr-only" aria-live="polite">{{ announcement() }}</p>
  </div>
</div>
