<div class="relative">
  <input
    #trigger="cdkOverlayOrigin"
    cdkOverlayOrigin
    type="text"
    class="w-full rounded border border-neutral-300 px-3 py-1.5 text-sm text-neutral-900 focus:border-neutral-500 focus:outline-none"
    [placeholder]="placeholder"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
    (focus)="onFocus()"
    (keydown.escape)="close()"
  />

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="close()"
  >
    <ul
      class="mt-1 max-h-56 w-64 overflow-auto rounded border border-neutral-200 bg-white py-1 shadow-lg"
      role="listbox"
    >
      @if (loading) {
        <li class="px-3 py-1.5 text-sm text-neutral-400">Searching…</li>
      } @else {
        @for (option of options; track option.id) {
          <li>
            <button
              type="button"
              role="option"
              class="block w-full px-3 py-1.5 text-left text-sm text-neutral-800 hover:bg-neutral-100"
              (click)="select(option)"
            >
              {{ option.label }}
            </button>
          </li>
        } @empty {
          @if (allowCreate && query().trim().length > 0) {
            <li>
              <button
                type="button"
                class="block w-full px-3 py-1.5 text-left text-sm text-neutral-600 hover:bg-neutral-100"
                (click)="createNew()"
              >
                + Add "{{ query() }}"
              </button>
            </li>
          } @else {
            <li class="px-3 py-1.5 text-sm text-neutral-400">No matches</li>
          }
        }
      }
    </ul>
  </ng-template>
</div>
