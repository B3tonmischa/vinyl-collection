<div class="w-80 rounded-lg bg-white p-5 shadow-xl">
  <h2 class="text-base font-semibold text-neutral-900">{{ data.title }}</h2>
  <p class="mt-2 text-sm text-neutral-600">{{ data.message }}</p>
  <div class="mt-5 flex justify-end gap-2">
    <button
      type="button"
      class="rounded px-3 py-1.5 text-sm text-neutral-600 hover:bg-neutral-100"
      (click)="cancel()"
    >
      {{ data.cancelLabel ?? 'Cancel' }}
    </button>
    <button
      type="button"
      class="rounded bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700"
      (click)="confirm()"
    >
      {{ data.confirmLabel ?? 'Delete' }}
    </button>
  </div>
</div>
