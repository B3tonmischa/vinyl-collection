<div
  class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2"
  aria-live="polite"
  role="status"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-lg bg-neutral-900 px-4 py-2.5 text-sm text-white shadow-lg"
    >
      <span>{{ toast.message }}</span>
      @if (toast.undo) {
        <button
          type="button"
          class="font-medium text-amber-300 hover:text-amber-200"
          (click)="toastService.runUndo(toast.id)"
        >
          Undo
        </button>
      }
      <button
        type="button"
        class="text-neutral-400 hover:text-white"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss"
      >
        ✕
      </button>
    </div>
  }
</div>
