# Self-hosting stack for the vinyl archive. See DEPLOYMENT.md for the
# full setup guide (Cloudflare Tunnel, first run, backups).
#
# Three services, always run together — there is no router configuration
# and no host port is published anywhere in this file:
#
#   backend      NestJS API, reachable only from other containers on the
#                `internal` network.
#   caddy        Serves the built Angular app and reverse-proxies
#                /vinyl-collection/api/* to the backend. Not exposed to
#                the host either — see frontend/Caddyfile.
#   cloudflared  The only thing that talks to the outside world: it opens
#                an outbound-only connection from this network to
#                Cloudflare's edge and forwards tunnelled requests to
#                caddy. Public HTTPS is terminated by Cloudflare, not by
#                anything in this stack.
#
#   docker compose up -d --build

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/data/uploads
    networks:
      - internal

  caddy:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    restart: unless-stopped
    depends_on:
      - caddy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - internal

networks:
  internal:
